<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin Console | George &amp; Noonan Open Houses</title>
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/brand.css">
<link rel="stylesheet" href="/nav.css">
<link rel="stylesheet" href="/dialog.css">
<style>
/* Admin Console layout: sections in the top navigation bar (nav.js), one view at a time. */
main{padding-bottom:64px}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:.88rem;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar .field{max-width:280px}
.toolbar .spacer{flex:1}
.toolbar .feed{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn.refresh{background:none;border-color:transparent;color:var(--muted);font-size:.85rem;font-weight:500;padding:6px 8px;gap:5px}
.btn.refresh:hover:not(:disabled){color:var(--ink);background:var(--surface);border-color:var(--line)}
.refresh svg{width:14px;height:14px;flex:none}
.refresh.busy:disabled{opacity:1;cursor:progress}
.refresh.busy svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.refresh.busy svg{animation:none}}
h2.section{font-family:var(--serif);font-weight:500;font-size:1.3rem;margin:28px 0 12px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.stat{padding:14px 16px}
.stat b{display:block;font-family:var(--serif);font-size:1.9rem;font-weight:500;line-height:1.1}
.stat span{font-size:.85rem;color:var(--muted)}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Time frame (by open house date): sets the stat cards and the requests list */
.timeframe{display:flex;gap:10px 14px;align-items:flex-end;flex-wrap:wrap;margin:18px 0 14px}
.timeframe label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
.timeframe .field{width:auto;height:44px;color:var(--ink)}
.timeframe select.field{min-width:170px}
.tf-dates{display:flex;gap:10px;flex-wrap:wrap}
.tf-dates[hidden]{display:none}
.tf-label{color:var(--muted);font-size:.92rem;padding-bottom:11px}
.stat.wait b{color:var(--brass)}

/* Requests list: waiting rows pinned at the top, then the time frame's requests. A row opens its request. */
tr.group th{background:var(--bg);text-transform:none;letter-spacing:0;font-size:.85rem;color:var(--ink)}
tr.group th span{color:var(--muted);font-weight:500;margin-left:4px}
tr.wait{background:var(--brass-soft)}
tr.wait td:first-child{box-shadow:inset 3px 0 0 var(--brass)}
table.reqs tr.req{cursor:pointer}
table.reqs td.home a{color:inherit;text-decoration:none}
table.reqs td.home a:hover{text-decoration:underline}
td .sub.alert{color:var(--danger);font-weight:600}
/* Keep each row's action (Review, Cancel) in view when a narrow window scrolls the table sideways */
table.reqs td:last-child{position:sticky;right:0;background:var(--surface)}
table.reqs tr.wait td:last-child{background:var(--brass-soft)}
@media (hover:hover){table.reqs tr.req:not(.wait):hover td{background:var(--bg)}}
@media (max-width:720px){
  #csv{display:none}
  #search{max-width:none;flex:1 1 100%}
  table.reqs td:last-child{position:static;background:none}
  table.reqs td .btn.small{min-height:44px;padding:10px 22px}
  table.stack tr.group{padding:0}
  table.stack tr.group th{display:block}
  table.stack tr.wait{box-shadow:inset 3px 0 0 var(--brass)}
  table.stack tr.wait td:first-child{box-shadow:none}
  /* Three short lines: when · status / home / agent · action */
  table.stack.reqs tr.req{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 12px}
  table.stack.reqs tr.req td{display:block;padding:0;text-align:left}
  table.stack.reqs tr.req td::before{content:none}
  table.stack.reqs tr.req td.when{grid-area:1/1}
  table.stack.reqs tr.req td.status{grid-area:1/2;text-align:right}
  table.stack.reqs tr.req td.home{grid-area:2/1/3/3}
  table.stack.reqs tr.req td.agent{grid-area:3/1}
  table.stack.reqs tr.req td.act{grid-area:3/2;text-align:right}
  table.stack.reqs tr.req td.act:empty{display:none}
  table.stack.reqs td.when .sub,table.stack.reqs td.home .sub{display:inline}
  table.stack.reqs td.when .sub::before,table.stack.reqs td.home .sub::before{content:" · "}
  table.stack.reqs td.act .link{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;font-size:.95rem}
}

/* One agent's open houses: a photo of each home beside its address */
.thumb{display:block;width:72px;height:54px;border-radius:8px;background:var(--photo);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
table.hist td.pic{width:72px;padding-right:0}
table.hist td.home{padding-left:12px}
@media (max-width:720px){
  /* Photo on the left; beside it the day and status, then the home, then who decided */
  table.stack.hist tr{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:start;gap:3px 12px}
  table.stack.hist td{display:block;padding:0;text-align:left}
  table.stack.hist td::before{content:none}
  table.stack.hist td.pic{grid-area:1/1/4/2;width:auto}
  table.stack.hist .thumb{width:64px;height:48px}
  table.stack.hist td.when{grid-area:1/2}
  table.stack.hist td.status{grid-area:1/3;text-align:right}
  table.stack.hist td.home{grid-area:2/2/3/4}
  table.stack.hist td.decided{grid-area:3/2/4/4;font-size:.84rem;color:var(--muted)}
  table.stack.hist td.decided.none{display:none}
  table.stack.hist td.empty{grid-column:1/-1;padding:16px 0;text-align:center}
  table.stack.hist td .sub{display:inline}
  table.stack.hist td.when .sub::before,table.stack.hist td.home .sub::before,table.stack.hist td.decided div.sub::before{content:" · "}
}

/* Pages of a list (requests, an agent's open houses): rows per page, which rows are showing, Previous and Next */
.pager{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:.9rem;color:var(--muted)}
.pg-size{display:flex;gap:8px;align-items:center}
.pg-size .field{width:auto;padding-top:7px;padding-bottom:7px;color:var(--ink)}
.pg-nav{display:flex;gap:8px;margin-left:auto}
@media (max-width:720px){
  .pg-info{flex:1;text-align:right}
  .pg-of{display:none}
  .pg-nav{width:100%}
  .pg-nav .btn{flex:1;min-height:44px}
}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.92rem} /* separate: row lines stay whole-pixel under the sticky action column */
th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .sub{font-size:.84rem;color:var(--muted)}
@media (max-width:720px){
  table.stack thead{display:none}
  table.stack tr{display:block;padding:12px 14px;border-bottom:1px solid var(--line)}
  table.stack td{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border:0;text-align:right}
  table.stack td::before{content:attr(data-l);color:var(--muted);font-size:.82rem;text-align:left}
}

/* Listing editor cards */
.listings{display:grid;gap:14px}
.lcard{display:grid;grid-template-columns:200px 1fr;overflow:hidden}
.lcard.pri{border-color:var(--priority);box-shadow:0 0 0 2px var(--priority)}
.lcard .photo{background:var(--photo);min-height:160px;position:relative}
.lcard .photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.lcard .body{padding:16px 18px}
.lcard h3{font-family:var(--serif);font-weight:500;font-size:1.25rem;margin:0;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.lcard .badges{display:inline-flex;gap:6px;flex-wrap:wrap;font-family:var(--sans)}
.intro-actions{display:flex;gap:8px;flex-wrap:wrap}
/* Home details: address, city, ZIP on one row; price, bedrooms, bathrooms, square feet on the next. */
.homegrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px 12px;margin-top:12px}
.homegrid .label{margin:0;font-weight:500;color:var(--muted);grid-column:span 3}
.homegrid .label:nth-child(1){grid-column:span 6}
.homegrid .label:nth-child(2){grid-column:span 4}
.homegrid .label:nth-child(3){grid-column:span 2}
.homegrid .field{margin-top:6px;color:var(--ink)}
@media (max-width:720px){.homegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.homegrid .label,.homegrid .label:nth-child(n){grid-column:span 1}.homegrid .label:nth-child(1){grid-column:span 2}}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.home-edit{margin-top:16px;padding-top:4px;border-top:1px solid var(--line)}
.home-edit h4{font-size:.95rem;margin:16px 0 4px}
.photos{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.photos figure{margin:0;width:132px}
.photos img{width:132px;height:96px;object-fit:cover;border-radius:8px;background:var(--photo);display:block}
.photos figcaption{font-size:.8rem;color:var(--muted);margin-top:4px}
.photos .link{font-size:.8rem}
.suggest{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;margin-top:8px;background:var(--accent-soft);border-radius:8px;font-size:.93rem}
.link.danger{color:var(--danger)}
.lcard .toggles{display:flex;gap:10px 20px;flex-wrap:wrap;margin:12px 0 2px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
/* Tooltip: shows on hover or keyboard focus (e.g. what "Vacant" means) */
.tip{position:relative}
.tip-i{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font-size:.68rem;font-weight:700;font-style:normal;line-height:1}
.tip-text{position:absolute;left:0;top:calc(100% + 8px);z-index:20;width:max-content;max-width:min(260px,80vw);padding:8px 11px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:.82rem;font-weight:500;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none}
.tip:has(:focus-visible) .tip-text{opacity:1;visibility:visible}
@media (hover:hover){.tip:hover .tip-text{opacity:1;visibility:visible}}
.lcard .two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.lcard .foot{display:flex;gap:12px;align-items:center;margin-top:14px}
.lcard .mls-oh{font-size:.85rem;color:var(--brass);margin-top:4px}
@media (max-width:720px){.lcard{grid-template-columns:1fr}.lcard .photo{min-height:150px}.lcard .two{grid-template-columns:1fr}}
.banner{padding:12px 16px;border-left:4px solid var(--brass);margin-bottom:16px;font-size:.93rem}
.banner.err{border-left-color:var(--danger)}

/* Agents and settings */
.panel{padding:18px 20px;margin-bottom:16px}
.panel h3{margin:0 0 4px;font-size:1.02rem}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.addrow .field{flex:1;min-width:200px}
.taglist{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.taglist li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 8px 5px 14px;font-size:.9rem}
.taglist li.fixed{padding-right:14px}
.taglist li .link{font-size:.82rem}
.cut{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.cut .field{width:auto}
.summary{margin-top:12px;padding:10px 14px;background:var(--accent-soft);border-radius:8px;font-size:.93rem}
.switch{display:flex;gap:12px;align-items:center;cursor:pointer}
.switch input{width:44px;height:24px;accent-color:var(--accent)}
</style>
</head>
<body>
<header class="topnav" id="topnav">
  <div class="wrap topnav-bar">
    <a class="topnav-brand" href="#requests"><img class="logo-light" src="/gn-logo.png" alt="George &amp; Noonan Real Estate Group"><img class="logo-dark" src="/gn-logo-white.png" alt="George &amp; Noonan Real Estate Group"><span class="topnav-label">Admin Console</span></a>
  </div>
</header>
<div class="wrap">
  <main id="view"></main>
</div>

<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle" hidden>
  <div class="gate-card">
    <img class="logo logo-light" src="/gn-logo.png" alt="George &amp; Noonan Real Estate Group">
    <img class="logo logo-dark" src="/gn-logo-white.png" alt="George &amp; Noonan Real Estate Group">
    <h2 id="gateTitle">Admin Console</h2>
    <p>Sign in with your George &amp; Noonan team Google account.</p>
    <div id="gBtn"></div>
    <p class="gate-msg" id="gateMsg" role="alert" hidden></p>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/nav.js"></script>
<script src="/dialog.js"></script>
<script src="/admin/console.js"></script>
</body>
</html>
