<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin Console | George &amp; Noonan Open Houses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/brand.css">
<link rel="stylesheet" href="/nav.css">
<style>
/* Admin Console layout: sections in the top navigation bar (nav.js), one view at a time. */
main{padding-bottom:64px}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:.88rem;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar .field{max-width:280px}
.toolbar .spacer{flex:1}
h2.section{font-family:var(--serif);font-weight:500;font-size:1.3rem;margin:28px 0 12px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.stat{padding:14px 16px}
.stat b{display:block;font-family:var(--serif);font-size:1.9rem;font-weight:500;line-height:1.1}
.stat span{font-size:.85rem;color:var(--muted)}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Pending request cards */
.queue{display:grid;gap:12px}
.req{display:grid;grid-template-columns:96px 1fr auto;gap:16px;padding:14px;align-items:start}
.req .thumb{width:96px;height:72px;border-radius:10px;background:var(--photo);object-fit:cover}
.req h3{font-family:var(--serif);font-weight:500;font-size:1.15rem;margin:0}
.req .when{font-weight:600;margin:2px 0}
.req .meta{font-size:.88rem;color:var(--muted)}
.req .notes{font-size:.9rem;margin-top:6px;padding:8px 10px;background:var(--bg);border-radius:8px}
.req .act{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:190px}
.req .act .btns{display:flex;gap:8px}
.req .act .btns .btn{flex:1}
@media (max-width:720px){
  .req{grid-template-columns:72px 1fr}
  .req .thumb{width:72px;height:56px}
  .req .act{grid-column:1/-1;min-width:0}
}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .sub{font-size:.84rem;color:var(--muted)}
@media (max-width:720px){
  table.stack thead{display:none}
  table.stack tr{display:block;padding:12px 14px;border-bottom:1px solid var(--line)}
  table.stack td{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border:0;text-align:right}
  table.stack td::before{content:attr(data-l);color:var(--muted);font-size:.82rem;text-align:left}
}

/* Listing editor cards */
.listings{display:grid;gap:14px}
.lcard{display:grid;grid-template-columns:200px 1fr;overflow:hidden}
.lcard.pri{border-color:var(--priority);box-shadow:0 0 0 2px var(--priority)}
.lcard .photo{background:var(--photo);min-height:160px;position:relative}
.lcard .photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.lcard .body{padding:16px 18px}
.lcard h3{font-family:var(--serif);font-weight:500;font-size:1.25rem;margin:0;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.lcard .badges{display:inline-flex;gap:6px;flex-wrap:wrap;font-family:var(--sans)}
.intro-actions{display:flex;gap:8px;flex-wrap:wrap}
/* Home details: address, city, ZIP on one row; price, bedrooms, bathrooms, square feet on the next. */
.homegrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px 12px;margin-top:12px}
.homegrid .label{margin:0;font-weight:500;color:var(--muted);grid-column:span 3}
.homegrid .label:nth-child(1){grid-column:span 6}
.homegrid .label:nth-child(2){grid-column:span 4}
.homegrid .label:nth-child(3){grid-column:span 2}
.homegrid .field{margin-top:6px;color:var(--ink)}
@media (max-width:720px){.homegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.homegrid .label,.homegrid .label:nth-child(n){grid-column:span 1}.homegrid .label:nth-child(1){grid-column:span 2}}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.home-edit{margin-top:16px;padding-top:4px;border-top:1px solid var(--line)}
.home-edit h4{font-size:.95rem;margin:16px 0 4px}
.photos{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.photos figure{margin:0;width:132px}
.photos img{width:132px;height:96px;object-fit:cover;border-radius:8px;background:var(--photo);display:block}
.photos figcaption{font-size:.8rem;color:var(--muted);margin-top:4px}
.photos .link{font-size:.8rem}
.suggest{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;margin-top:8px;background:var(--accent-soft);border-radius:8px;font-size:.93rem}
.link.danger{color:var(--danger)}
.lcard .toggles{display:flex;gap:10px 20px;flex-wrap:wrap;margin:12px 0 2px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.lcard .two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.lcard .foot{display:flex;gap:12px;align-items:center;margin-top:14px}
.lcard .mls-oh{font-size:.85rem;color:var(--brass);margin-top:4px}
@media (max-width:720px){.lcard{grid-template-columns:1fr}.lcard .photo{min-height:150px}.lcard .two{grid-template-columns:1fr}}
.banner{padding:12px 16px;border-left:4px solid var(--brass);margin-bottom:16px;font-size:.93rem}
.banner.err{border-left-color:var(--danger)}

/* Agents and settings */
.panel{padding:18px 20px;margin-bottom:16px}
.panel h3{margin:0 0 4px;font-size:1.02rem}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.addrow .field{flex:1;min-width:200px}
.taglist{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.taglist li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 8px 5px 14px;font-size:.9rem}
.taglist li.fixed{padding-right:14px}
.taglist li .link{font-size:.82rem}
.cut{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.cut .field{width:auto}
.summary{margin-top:12px;padding:10px 14px;background:var(--accent-soft);border-radius:8px;font-size:.93rem}
.switch{display:flex;gap:12px;align-items:center;cursor:pointer}
.switch input{width:44px;height:24px;accent-color:var(--accent)}
</style>
</head>
<body>
<header class="topnav" id="topnav">
  <div class="wrap topnav-bar">
    <a class="topnav-brand" href="#requests"><img class="logo-light" src="/gn-logo.png" alt="George &amp; Noonan Real Estate Group"><img class="logo-dark" src="/gn-logo-white.png" alt="George &amp; Noonan Real Estate Group"><span class="topnav-label">Admin Console</span></a>
  </div>
</header>
<div class="wrap">
  <main id="view"></main>
</div>

<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle" hidden>
  <div class="gate-card">
    <img class="logo logo-light" src="/gn-logo.png" alt="George &amp; Noonan Real Estate Group">
    <img class="logo logo-dark" src="/gn-logo-white.png" alt="George &amp; Noonan Real Estate Group">
    <h2 id="gateTitle">Admin Console</h2>
    <p>Sign in with your George &amp; Noonan team Google account.</p>
    <div id="gBtn"></div>
    <p class="gate-msg" id="gateMsg" role="alert" hidden></p>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/nav.js"></script>
<script src="/admin/console.js"></script>
</body>
</html>
