<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Manage open houses | Open House Requests</title>
<style>
:root{--bg:#F4F5F3;--surface:#fff;--ink:#16202A;--muted:#5A6570;--line:#DCE0E2;--accent:#1E5B4F;--accent-ink:#fff;--danger:#A12B2B}
@media (prefers-color-scheme:dark){:root{--bg:#11171C;--surface:#182129;--ink:#ECEFF1;--muted:#9AA6B0;--line:#2A3540;--accent:#5FB3A0;--accent-ink:#0E1A17;--danger:#E58A8A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
a{color:var(--accent)}
h1{font-size:1.5rem;margin:.5rem 0 .25rem}
.lead{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:1.05rem;margin:0}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:10px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
label.inline{display:inline-flex;gap:6px;align-items:center;font-weight:500;margin:0 14px 0 0}
textarea{width:100%;min-height:84px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{padding:10px 18px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.msg{font-size:.9rem}.msg.err{color:var(--danger)}
.note{font-size:.85rem;color:var(--muted)}
.badge{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--line);margin-left:8px;vertical-align:middle}
details{margin-top:24px;font-size:.9rem}pre{white-space:pre-wrap;word-break:break-all;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
#gbtn{display:flex;justify-content:center;margin-top:12px}
</style>
</head>
<body>
<main id="app"><p>Loading…</p></main>
<script>
const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => "$" + Number(n).toLocaleString("en-US");

async function signIn() {
  app.innerHTML = '<h1>Sign in</h1><p class="lead">Use your George &amp; Noonan team Google account.</p><div id="gbtn"></div><p class="msg err" id="m"></p>';
  const cfg = await fetch("/api/config").then((r) => r.json()).catch(() => ({}));
  const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true;
  s.onload = () => {
    google.accounts.id.initialize({ client_id: cfg.googleClientId, callback: async (resp) => {
      const r = await fetch("/api/auth/google", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ credential: resp.credential }) });
      if (r.ok) return location.reload();
      document.getElementById("m").textContent = r.status === 403 ? "That account isn't authorized for this site." : "Sign-in failed. Try again.";
    } });
    google.accounts.id.renderButton(document.getElementById("gbtn"), { theme: "outline", size: "large", shape: "pill", width: 280 });
  };
  document.head.append(s);
}

function card(l) {
  const c = document.createElement("section"); c.className = "card";
  const oh = l.openHouses.length ? `<p class="note">Already on the MLS: ${l.openHouses.map((o) => esc(o.day === "sat" ? "Sat" : "Sun") + " " + o.from + ":00 to " + o.to + ":00").join(", ")}</p>` : "";
  c.innerHTML = `<h2>${esc(l.addr)}, ${esc(l.city)}${l.offered ? '<span class="badge">Offered this weekend</span>' : ""}</h2>
    <div class="sub">MLS# ${esc(l.mls)} &middot; ${money(l.price)}</div>${oh}
    <div class="row" style="margin-top:0"><label class="inline"><input type="checkbox" data-f="offered" ${l.offered ? "checked" : ""}> Offer this weekend</label>
      <label class="inline"><input type="checkbox" data-f="sat" ${l.days.includes("sat") ? "checked" : ""}> Saturday</label>
      <label class="inline"><input type="checkbox" data-f="sun" ${l.days.includes("sun") ? "checked" : ""}> Sunday</label></div>
    <label>Open house instructions (one per line, shown to agents)</label><textarea data-f="instr">${esc(l.instr.join("\n"))}</textarea>
    <label>Access details (gate, lockbox, alarm). Only sent in the Confirmed and Reminder emails.</label><textarea data-f="access">${esc(l.access)}</textarea>
    <div class="row"><button>Save</button><span class="msg" role="status"></span></div>`;
  const q = (f) => c.querySelector(`[data-f="${f}"]`), msg = c.querySelector(".msg");
  c.querySelector("button").onclick = async () => {
    msg.className = "msg"; msg.textContent = "Saving…";
    const days = ["sat", "sun"].filter((d) => q(d).checked);
    const r = await fetch("/api/team/listings", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({
      mls: l.mls, offered: q("offered").checked, days, instr: q("instr").value.split("\n"), access: q("access").value }) }).catch(() => null);
    const j = r ? await r.json().catch(() => ({})) : {};
    if (r && r.ok) { msg.textContent = "Saved."; c.querySelector("h2 .badge")?.remove(); if (q("offered").checked) c.querySelector("h2").insertAdjacentHTML("beforeend", '<span class="badge">Offered this weekend</span>'); }
    else { msg.className = "msg err"; msg.textContent = j.message || "Could not save. Try again."; }
  };
  return c;
}

async function load() {
  const r = await fetch("/api/team/listings").catch(() => null);
  if (!r) return (app.innerHTML = "<p>Could not reach the server.</p>");
  if (r.status === 401) return signIn();
  if (r.status === 403) return (app.innerHTML = "<h1>Team members only</h1><p>Ask an administrator to add you.</p>");
  const d = await r.json();
  if (!r.ok) return (app.innerHTML = `<a href="/">← Back</a><h1>Listings unavailable</h1><p class="msg err">${esc(d.message || "Could not load listings from Repliers.")}</p>`);
  app.innerHTML = `<a href="/">← Back to open house requests</a><h1>Manage open houses</h1>
    <p class="lead">Weekend of ${esc(d.week.sat.date)} and ${esc(d.week.sun.date)}. Requests close ${esc(d.closesLabel)}. Turn on the homes agents can request, and add instructions and access details. Offers reset each week; instructions are kept.</p>
    <div id="list"></div>
    <details><summary>Check Repliers data</summary><p class="note">Shows one raw listing so field mapping can be verified.</p><button id="raw">Show sample</button><pre id="rawOut" hidden></pre></details>`;
  const list = document.getElementById("list");
  if (!d.listings.length) list.innerHTML = '<p class="lead">No active listings found for Troy George or Lucy Noonan.</p>';
  d.listings.forEach((l) => list.append(card(l)));
  document.getElementById("raw").onclick = async () => {
    const j = await fetch("/api/team/listings?raw=1").then((x) => x.json()).catch(() => ({}));
    const o = document.getElementById("rawOut"); o.hidden = false; o.textContent = JSON.stringify(j.sample ?? j, null, 2);
  };
}
load();
</script>
</body>
</html>
