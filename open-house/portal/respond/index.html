<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Respond to open house request</title>
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="/dialog.css">
<style>
:root{--bg:#F4F5F3;--surface:#fff;--ink:#16202A;--muted:#5A6570;--line:#DCE0E2;--accent:#1E5B4F;--accent-ink:#fff;--accent-soft:#E7F0EE;--danger:#A12B2B}
@media (prefers-color-scheme:dark){:root{--bg:#11171C;--surface:#182129;--ink:#ECEFF1;--muted:#9AA6B0;--line:#2A3540;--accent:#5FB3A0;--accent-ink:#0E1A17;--accent-soft:#1C2E2B;--danger:#E58A8A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 32px}
a.back{display:inline-block;padding:10px 0;margin-bottom:6px;color:var(--accent);font-weight:600;text-decoration:none}
a.back:hover{text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:1.35rem;margin:0 0 12px}
h1:focus{outline:none}
dl{margin:0 0 16px}dt{color:var(--muted);font-size:.85rem;margin-top:10px}dd{margin:0;word-break:break-word}
label.check{display:flex;gap:10px;align-items:flex-start;margin:16px 0;font-size:.95rem}
label.check input{margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row.actions{margin-top:16px}
button,a.btn{padding:12px 20px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;border:2px solid var(--accent);text-decoration:none;display:inline-block;text-align:center}
button.go,a.btn.go{background:var(--accent);color:var(--accent-ink)}
button.no,a.btn.no{background:none;color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
#msg{margin-top:14px}#msg.err,.err{color:var(--danger)}
#gbtn{display:flex;justify-content:center;margin-top:12px}
h2{font-size:1rem;margin:22px 0 8px}
.pill{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px;border:1px solid var(--line)}
.pill.ok{color:var(--accent);border-color:var(--accent)}.pill.bad{color:var(--danger);border-color:var(--danger)}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.grid label{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input[type=date],select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
label.reason{display:block;margin:18px 0 6px}
textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;min-height:96px;resize:vertical}
ul.log{list-style:none;padding:0;margin:0;font-size:.85rem}ul.log li{padding:6px 0;border-bottom:1px solid var(--line)}
ul.log .t{color:var(--muted)}
.shot{max-width:100%;border:1px solid var(--line);border-radius:8px;margin-top:8px}
.muted{color:var(--muted);font-size:.9rem}
.box.ask{border:2px solid var(--danger)}.box.ask h2{margin-top:0;color:var(--danger)}
/* How the open house goes on the MLS: one of two options, chosen before confirming */
fieldset.how{border:0;padding:0;margin:20px 0 0;min-width:0}
fieldset.how legend{font-weight:600;padding:0;margin-bottom:2px}
label.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:8px;cursor:pointer}
label.opt input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
label.opt > span > b{display:block}
label.opt .muted{display:block;margin-top:2px}
label.opt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
label.opt:has(input:disabled){cursor:not-allowed}
label.opt:has(input:disabled) b{color:var(--muted)}
label.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
#hint{margin:12px 0 0}
/* AI agent progress */
ol.steps{list-style:none;padding:0;margin:20px 0 4px}
ol.steps li{display:grid;grid-template-columns:24px 1fr;column-gap:12px;padding-bottom:18px;position:relative}
ol.steps li::before{content:"";grid-row:1/3;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:800;line-height:1}
ol.steps li:not(:last-child)::after{content:"";position:absolute;left:11px;top:28px;bottom:4px;width:2px;background:var(--line)}
ol.steps b,ol.steps span{grid-column:2}
ol.steps span{color:var(--muted);font-size:.9rem}
ol.steps span:empty{display:none}
ol.steps li:not(.active):not(.done):not(.wait):not(.bad) b{color:var(--muted);font-weight:500}
ol.steps li.active::before{border-color:var(--accent);border-right-color:transparent;animation:spin .9s linear infinite}
ol.steps li.wait::before{border-color:var(--accent);border-style:dashed}
ol.steps li.done::before{content:"✓";background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
ol.steps li.done:not(:last-child)::after{background:var(--accent)}
ol.steps li.bad::before{content:"!";border-color:var(--danger);color:var(--danger)}
ol.steps li.bad span,ol.steps li.warn span{color:var(--danger)}
@keyframes spin{to{transform:rotate(360deg)}}
/* Confirmed: a 5-second countdown, then the Open House Portal */
.confirmed{text-align:center}
.confirmed .tick{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:4px auto 14px}
.confirmed .tick svg{width:30px;height:30px}
.confirmed .row{justify-content:center;margin-top:18px}
.count{margin:20px auto 0;max-width:320px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);transform-origin:left;animation:drain 5s linear forwards}
.count p{margin:10px 0 0}
#secs{white-space:nowrap}
@keyframes drain{to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){ol.steps li.active::before{animation:none;border-right-color:var(--accent)}.bar span{animation:none}}
</style>
</head>
<body>
<main><a class="back" id="back" href="/admin/#requests">← Back to Requests</a><div class="card" id="card"><p>Loading…</p></div></main>
<script src="/dialog.js"></script>
<script>
const $ = (id) => document.getElementById(id), card = $("card");
// Back returns to the page that opened this one (the Admin Console keeps its filters), or to the
// Admin Console's Requests list when this page was opened from an email.
(() => {
  let ref = null;
  try { ref = document.referrer ? new URL(document.referrer) : null; } catch {}
  if (!ref || ref.origin !== location.origin || ref.pathname.startsWith("/respond")) return;
  if (!ref.pathname.startsWith("/admin")) $("back").textContent = "← Back";
  $("back").onclick = (e) => { if (history.length > 1) { e.preventDefault(); history.back(); } };
})();
const params = new URLSearchParams(location.search);
const id = params.get("id") || "", preset = params.get("action");
const el = (html) => { card.innerHTML = html; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const PORTAL = "/"; // where the team goes once an open house is confirmed
const getReq = () => fetch("/api/respond?id=" + encodeURIComponent(id)).then((r) => (r.ok ? r.json() : null)).catch(() => null);
const post = (url, body) => fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, ...body }) }).catch(() => null);

async function signIn() {
  el('<h1>Sign in to respond</h1><p>Use your George &amp; Noonan team Google account.</p><div id="gbtn"></div><p id="msg" class="err" role="alert"></p>');
  const cfg = await fetch("/api/config").then((r) => r.json()).catch(() => ({}));
  const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true;
  s.onload = () => {
    google.accounts.id.initialize({ client_id: cfg.googleClientId, callback: async (resp) => {
      const r = await fetch("/api/auth/google", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ credential: resp.credential }) });
      if (r.ok) return location.reload();
      $("msg").textContent = r.status === 403 ? "That account isn't authorized for this site." : "Sign-in failed. Try again.";
    } });
    google.accounts.id.renderButton($("gbtn"), { theme: "outline", size: "large", shape: "pill", width: 280 });
  };
  document.head.append(s);
}

async function load() {
  const r = await fetch("/api/respond?id=" + encodeURIComponent(id)).catch(() => null);
  if (!r) return el("<p>Could not reach the server.</p>");
  if (r.status === 401) return signIn();
  if (r.status === 403) return el("<h1>Team members only</h1><p>Your account can't approve open house requests. Ask an administrator to add you.</p>");
  if (r.status === 404) return el("<h1>Request not found</h1><p>This link may be wrong or out of date.</p>");
  const d = await r.json(), details = detailsOf(d);
  if (d.status === "pending" && d.cancelRequest) return askView(d, details);
  // The Decline link in the team's email opens the decline step straight away (once; Back shows the request).
  if (d.status === "pending" && preset === "decline" && !presetUsed) { presetUsed = true; return declineView(d, details); }
  if (d.status === "pending" && d.approving) return approvingView(d, details);
  if (d.status === "approved" || d.status === "cancelled") return manage(d, details);
  if (d.status !== "pending") {
    return el(`<h1>Already ${esc(d.status)}</h1>${details}<p>${d.decidedBy ? "Answered by " + esc(d.decidedBy) + "." : ""}</p>
      ${d.declineReason ? `<p><b>Reason:</b> ${esc(d.declineReason)}</p>` : ""}`);
  }
  // A home on the MLS needs one of two choices before it can be confirmed: the team entered it on the
  // MLS by hand, or the AI agent enters it (Start). A team-added home that isn't on the MLS yet has nothing to enter.
  el(`<h1>Open house request</h1>${details}
    ${!d.onMls ? `<p class="muted">This home isn't on the MLS yet. Once it's linked to its MLS listing in the Admin Console, ${d.mode === "off" ? "enter approved open houses on the MLS by hand" : "approved open houses go to the AI agent"}.</p>`
      : `<fieldset class="how"><legend>How is this open house going on the MLS?</legend>
        <p class="muted" style="margin:0">Choose one to confirm the request.</p>
        <label class="opt"><input type="radio" name="how" value="manual"><span><b>Submitted manually</b><span class="muted">I've entered this open house on the MLS (NTREIS) myself.</span></span></label>
        <label class="opt"><input type="radio" name="how" value="agent" ${d.agentReady ? "" : "disabled"}><span><b>Schedule Open House with AI Agent</b><span class="muted">${d.agentReady
          ? `The AI agent enters it on NTREIS for you and reports back here. It's approved once it's on the MLS.${d.mode === "dry_run" ? " Right now it runs as a <b>dry run</b>: it fills in the form but doesn't submit, so the request isn't approved this way." : ""}`
          : "Not available yet: the AI agent isn't connected."}</span></span></label>
      </fieldset><p class="muted" id="hint" hidden></p>`}
    <div class="row actions"><button class="go" id="approve" ${d.onMls ? "disabled" : ""}>Confirm open house</button><button class="no" id="decline">Decline</button></div><p id="msg" role="status"></p>`);
  const approve = $("approve"), decline = $("decline"), hint = $("hint");
  const how = () => document.querySelector('input[name="how"]:checked')?.value || null;
  document.querySelectorAll('input[name="how"]').forEach((i) => (i.onchange = () => {
    const agent = how() === "agent";
    approve.disabled = false; approve.textContent = agent ? "Start" : "Confirm open house";
    hint.hidden = false;
    hint.textContent = agent
      ? `Start sends it to the AI agent and holds the time. Once the AI agent has it on the MLS, it's approved and ${d.agentName} is emailed the confirmation. You'll see its progress here.`
      : `Confirming emails ${d.agentName} the confirmation and calendar invite.`;
  }));
  if (preset === "approve") document.querySelector('input[name="how"]')?.focus();
  const act = async (action) => {
    const method = how();
    approve.disabled = decline.disabled = true;
    $("msg").className = ""; $("msg").textContent = action === "approve" ? "Confirming…" : "Declining…";
    const r = await post("/api/respond", { action, method, mlsEntered: method === "manual" });
    const j = r ? await r.json().catch(() => ({})) : {};
    const saved = r && (r.ok || r.status === 502), warn = r && r.status === 502 ? j.message : ""; // 502: saved, but an email failed
    if (saved && method === "agent") return approvingView(d, details, true);
    if (saved) return confirmed(d, { warn, line: !d.onMls ? "This home isn't on the MLS yet, so there's nothing to enter there." : "Entered on the MLS by hand." });
    $("msg").className = "err"; $("msg").textContent = j.message || (j.error === "already_answered" ? "Someone already answered this request." : "Something went wrong. Try again.");
    decline.disabled = false; approve.disabled = d.onMls && !method;
  };
  approve.onclick = () => act("approve"); decline.onclick = () => declineView(d, details);
}

const detailsOf = (d) => `<dl><dt>Property</dt><dd>${esc(d.address)} (${d.mls ? `MLS# ${esc(d.mls)}` : "MLS# not found"})</dd><dt>When</dt><dd>${esc(d.when)}</dd>
    <dt>Agent</dt><dd>${esc(d.agent)}${d.phone ? "<br>" + esc(d.phone) : ""}</dd>${d.notes ? `<dt>Notes</dt><dd>${esc(d.notes)}</dd>` : ""}</dl>`;
let presetUsed = false;

// Decline, with an optional reason that goes to the agent in the decline email.
function declineView(d, details) {
  const first = esc(d.agentName.split(" ")[0]);
  el(`<h1>Decline this request</h1>${details}
    <label class="reason" for="reason"><b>Reason</b> <span class="muted">(optional) ${first} sees this in the decline email.</span></label>
    <textarea id="reason" maxlength="500" rows="4" placeholder="For example: another agent already has that time, or the sellers asked for no open houses this weekend."></textarea>
    <div class="row actions"><button class="go" id="send">Decline and email ${first}</button><button class="no" id="back">Back</button></div><p id="msg" role="status"></p>`);
  $("reason").focus();
  $("back").onclick = () => load();
  $("send").onclick = async () => {
    const reason = $("reason").value.trim();
    $("send").disabled = $("back").disabled = true; $("msg").className = ""; $("msg").textContent = "Declining…";
    const r = await post("/api/respond", { action: "decline", reason });
    const j = r ? await r.json().catch(() => ({})) : {};
    if (r && (r.ok || r.status === 502)) { // 502: declined, but the email failed
      return el(`<h1>Declined</h1>${details}<p>${r.ok ? `${esc(d.agentName)} has been emailed${reason ? " with your reason" : ""}.` : ""}</p>
        ${reason ? `<p><b>Reason:</b> ${esc(reason)}</p>` : ""}${r.ok ? "" : `<p class="err">${esc(j.message || "The email didn't send.")} Let ${esc(d.agentName)} know directly.</p>`}
        <div class="row"><a class="btn go" href="${PORTAL}">Go to the Open House Portal</a></div>`);
    }
    $("msg").className = "err"; $("msg").textContent = j.message || (j.error === "already_answered" ? "Someone already answered this request." : "Something went wrong. Try again.");
    $("send").disabled = $("back").disabled = false;
  };
}

// The open house is confirmed: 5 seconds, then the Open House Portal. If an email failed to send,
// the page stays put so the team sees it.
function confirmed(d, { line = "", warn = "" } = {}) {
  el(`<div class="confirmed">
    <div class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1 id="doneTitle" tabindex="-1">Open house confirmed</h1>
    <p style="margin:0">${esc(d.address)}<br>${esc(d.when)}</p>
    <p class="muted">${esc(line)} ${warn ? "" : `${esc(d.agentName)} has been emailed the confirmation.`}</p>
    ${warn ? `<p class="err">${esc(warn)} Let ${esc(d.agentName)} know directly.</p>`
      : `<div class="count"><div class="bar"><span></span></div><p class="muted">Taking you to the Open House Portal in <b id="secs">5 seconds</b>.</p></div>`}
    <div class="row"><a class="btn go" href="${PORTAL}">${warn ? "Go to the Open House Portal" : "Go now"}</a><button class="no" id="stay">Stay on this page</button></div></div>`);
  $("doneTitle").focus();
  let left = 5;
  const tick = warn ? null : setInterval(() => {
    left -= 1;
    if (left > 0) $("secs").textContent = `${left} second${left === 1 ? "" : "s"}`;
    else { clearInterval(tick); location.assign(PORTAL); }
  }, 1000);
  $("stay").onclick = () => { clearInterval(tick); load(); };
}

// AI agent: the request keeps waiting, its hours held, until the AI agent reports the open house is on the
// MLS; only then is it approved and the agent emailed. Start sends the job now; the page follows it. If the
// AI agent can't get it on the MLS (or only ran a dry run), the team retries, enters it by hand, or declines.
function step(n, cls, text) {
  const li = $("s" + n); if (!li) return;
  li.className = cls; li.querySelector("span").textContent = text;
}
async function approvingView(d, details, start = false) {
  el(`<h1 id="runTitle" tabindex="-1">Approving with the AI agent</h1>${details}
    <ol class="steps" aria-live="polite">
      <li id="s1"><b>Send it to the AI agent</b><span></span></li>
      <li id="s2"><b>AI agent enters it on NTREIS</b><span></span></li>
      <li id="s3"><b>Approve and email ${esc(d.agentName)}</b><span></span></li></ol>
    <p class="muted" id="leave">You can leave this page. The request stays in Waiting until the AI agent has it on the MLS, and the team is emailed if it runs into a problem.</p>
    <div class="row" id="next"></div><p id="msg" role="status"></p>`);
  $("runTitle").focus();
  if (start) { step(1, "active", "Sending…"); await post("/api/manage", { action: "start" }); }
  follow();
}

const atTime = (ms) => new Date(ms).toLocaleTimeString("en-US", { timeZone: "America/Chicago", hour: "numeric", minute: "2-digit" });
async function follow() {
  if (!$("s1")) return; // left the progress view
  const d = await getReq();
  if (!$("s1")) return;
  if (!d) return setTimeout(follow, 3000);
  if (d.status === "approved") { // the AI agent put it on the MLS, so it's approved
    step(1, "done", "Sent."); step(2, "done", "On the MLS ✓");
    step(3, d.emailFailed ? "done warn" : "done", d.emailFailed ? `Approved, but the email to ${d.agentName} didn't send.` : `Approved. ${d.agentName} has been emailed.`);
    return setTimeout(() => confirmed(d, { warn: d.emailFailed ? `The confirmation email to ${d.agentName} didn't send.` : "", line: "The AI agent entered it on the MLS (NTREIS)." }), 1200);
  }
  if (d.status !== "pending" || !d.approving) return load(); // declined, cancelled or entered by hand meanwhile
  const s = d.sync || {}, dry = d.mode === "dry_run";
  const sent = () => step(1, "done", s.job?.sentAt ? `Sent at ${atTime(s.job.sentAt)}${dry ? " as a dry run" : ""}.` : "Sent.");
  step(3, "", "");
  if (!s.state || s.state === "idle") {
    step(2, "", "");
    if (s.delivery?.attempts) step(1, "wait", `Couldn't reach the AI agent. Trying again at ${atTime(s.delivery.nextTryAt)}.`);
    else if (s.busy) step(1, "wait", "In line: the AI agent is finishing another open house first.");
    else step(1, "active", "Sending…");
  } else if (s.state === "booking") {
    sent(); step(2, "active", "Working on it. This usually takes a few minutes.");
  } else if (["failed", "needs_login", "dry_run_ok"].includes(s.state)) {
    if (s.job?.result === "delivery_failed") { step(1, "bad", s.message || "Couldn't reach the AI agent."); step(2, "", ""); }
    else {
      sent();
      step(2, "bad", s.state === "dry_run_ok" ? "Dry run passed, but nothing was submitted, so it isn't on the MLS."
        : s.state === "needs_login" ? `The AI agent couldn't sign in to the MLS. ${s.message || ""}` : s.message || "The AI agent couldn't finish.");
    }
    step(3, "bad", `Not approved yet. ${d.agentName} hasn't been emailed.`);
    return stuck(d);
  }
  setTimeout(follow, 3000);
}
// The AI agent couldn't put it on the MLS: try again, enter it by hand (that approves it now), or decline.
function stuck(d) {
  $("leave").hidden = true;
  $("next").innerHTML = `<button class="go" id="retry">${d.mode === "dry_run" ? "Run the dry run again" : "Retry"}</button>
    <button class="no" id="byHand">I entered it on the MLS by hand</button><button class="no" id="declineA">Decline</button>`;
  $("retry").onclick = async () => {
    $("next").innerHTML = ""; $("leave").hidden = false;
    step(1, "active", "Sending…"); step(2, "", ""); step(3, "", "");
    await post("/api/manage", { action: "retry" });
    follow();
  };
  $("byHand").onclick = () => approveByHand(d);
  $("declineA").onclick = () => declineView(d, detailsOf(d));
}
async function approveByHand(d) {
  if (!(await OHDialog.confirm({ title: "Approve it as entered by hand?", body: `Approve ${d.address} as entered on the MLS by hand. ${d.agentName} will be emailed the confirmation.`, ok: "Approve" }))) return;
  $("next").querySelectorAll("button").forEach((b) => (b.disabled = true));
  const r = await post("/api/respond", { action: "approve", method: "manual", mlsEntered: true });
  const j = r ? await r.json().catch(() => ({})) : {};
  const warn = r && r.status === 502 ? j.message : ""; // 502: saved, but an email failed
  if (r && (r.ok || r.status === 502)) return confirmed(d, { warn, line: "Entered on the MLS by hand." });
  $("msg").className = "err"; $("msg").textContent = j.message || "Something went wrong. Try again.";
  $("next").querySelectorAll("button").forEach((b) => (b.disabled = false));
}

const fmtH = (h) => `${h % 12 || 12}:00 ${h >= 12 ? "PM" : "AM"}`;
const STATE = {
  manual: ["", "Entered by hand"], idle: ["", "Waiting to send to the AI agent"], booking: ["", "AI agent is working on it"],
  synced: ["ok", "On the MLS ✓"], dry_run_ok: ["ok", "Dry run passed (not submitted)"], failed: ["bad", "MLS update failed"], needs_login: ["bad", "MLS sign-in needed"],
  not_on_mls: ["", "Home not on the MLS yet"],
};
const EVENT = {
  approved: "Approved", declined: "Declined", changed: "Time changed", cancelled: "Cancelled", retry: "MLS job retried",
  approving: "Approving with the AI agent", mls_manual: "Switched to entered by hand",
  mls_job_sent: "Sent to the AI agent", mls_booked: "Booked on the MLS", mls_updated: "Updated on the MLS", mls_cancelled: "Cancelled on the MLS",
  mls_already_done: "Already on the MLS", mls_dry_run: "Dry run finished", mls_failed: "AI agent failed", mls_needs_login: "MLS sign-in needed",
  mls_stalled: "AI agent stalled", mls_delivery_failed: "Couldn't reach the AI agent",
  cancel_requested: "Agent asked to cancel", cancel_kept: "Cancellation request turned down", linked: "Linked to the MLS listing",
};
const fmtAt = (iso) => new Date(iso).toLocaleString("en-US", { timeZone: "America/Chicago", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

// POST a team action to /api/manage, then reload the page (a 502 means it saved but an email failed).
async function postManage(body, btn) {
  btn.disabled = true; $("msg").className = ""; $("msg").textContent = "Saving…";
  const r = await post("/api/manage", body);
  const j = r ? await r.json().catch(() => ({})) : {};
  if (r && (r.ok || r.status === 502)) { await load(); if (j.message) { $("msg").className = "err"; $("msg").textContent = j.message; } return; }
  $("msg").className = "err"; $("msg").textContent = j.message || "Something went wrong. Try again."; btn.disabled = false;
}

// The agent asked to cancel: the team approves it or keeps the open house.
function cancelBox(d) {
  const c = d.cancelRequest, what = d.status === "approved" ? "open house" : "request";
  return `<div class="box ask"><h2>Cancellation requested</h2>
    <p style="margin:0">${esc(c.byName || "The agent")} asked on ${esc(fmtAt(new Date(c.at).toISOString()))} to cancel this ${what}.</p>
    ${c.reason ? `<p class="muted"><b>Reason:</b> ${esc(c.reason)}</p>` : ""}
    <p class="muted">Approving emails the agent and the team${d.status === "approved" && !d.byHand ? ", and the AI agent marks it Canceled on the listing" : ""}. Keeping it emails the agent that it's still on.</p>
    <div class="row"><button class="go" id="approveCancel">Approve cancellation</button><button class="no" id="keep">Keep the ${what}</button></div></div>`;
}
function bindCancelBox() {
  if ($("approveCancel")) $("approveCancel").onclick = () => postManage({ action: "cancel" }, $("approveCancel"));
  if ($("keep")) $("keep").onclick = () => postManage({ action: "keep" }, $("keep"));
}
function askView(d, details) {
  el(`<h1>Open house request</h1>${details}${cancelBox(d)}<p id="msg" role="status"></p>`);
  bindCancelBox();
}

function manage(d, details) {
  const s = d.sync || {}, live = d.status === "approved";
  let [cls, label] = STATE[s.state] || ["", d.byHand ? "Entered by hand" : "Not sent yet"];
  if (!live && s.state === "synced") label = "Cancelled on the MLS ✓"; // "synced" means the MLS matches, which for a cancellation means it's gone
  if (!live && s.state === "manual") label = "Remove by hand";
  const canRetry = ["failed", "needs_login", "dry_run_ok"].includes(s.state);
  const hours = (sel) => Array.from({ length: d.lastHour - d.firstHour + 1 }, (_, i) => d.firstHour + i)
    .map((h) => `<option value="${h}" ${h === sel ? "selected" : ""}>${fmtH(h)}</option>`).join("");
  el(`<h1>${live ? "Approved open house" : "Cancelled open house"}</h1>${details}
    ${live && d.cancelRequest ? cancelBox(d) : ""}
    <p>${d.decidedBy ? "Approved by " + esc(d.decidedBy) + ". " : ""}${d.cancelledBy ? "Cancelled by " + esc(d.cancelledBy) + "." : ""}</p>
    <h2>MLS</h2>
    <div class="box"><span class="pill ${cls}">${esc(label)}</span>${s.message ? `<p class="muted">${esc(s.message)}</p>` : ""}
      ${d.byHand ? `<p class="muted">${d.mode === "off" ? "Automatic MLS entry is off." : "This open house was entered on the MLS by hand."} ${live ? "Keep the MLS in step by hand after any change." : "Remove it from the MLS by hand if it's there."}</p>` : ""}
      ${s.job?.screenshot ? `<img class="shot" alt="MLS confirmation screenshot" src="/api/mls/screenshot?id=${encodeURIComponent(d.id)}">` : ""}
      ${canRetry ? '<div class="row" style="margin-top:10px"><button class="no" id="retry">Retry MLS job</button></div>' : ""}</div>
    ${live ? `<h2>Change the time</h2>
    <div class="box"><div class="grid">
      <label>Date (Sat or Sun)<input type="date" id="cDate" value="${esc(d.iso)}"></label>
      <label>Start<select id="cFrom">${hours(d.from)}</select></label>
      <label>End<select id="cTo">${hours(d.to)}</select></label></div>
      <div class="row" style="margin-top:12px"><button class="go" id="change">Save new time</button></div>
      <p class="muted">The agent gets an updated calendar invite${d.byHand ? "" : " and the AI agent updates the listing"}.</p></div>
    <h2>Cancel</h2>
    <div class="box"><p class="muted" style="margin-top:0">Emails the agent and the team${d.byHand ? "" : ", and the AI agent marks it Canceled on the listing"}.</p>
      <div class="row"><button class="no" id="cancel">Cancel this open house</button></div></div>` : ""}
    <p id="msg" role="status"></p>
    <h2>History</h2><ul class="log">${(d.events || []).map((e) => `<li><span class="t">${esc(fmtAt(e.at))}</span> · ${esc(EVENT[e.type] || e.type)}${e.by ? " · " + esc(e.by) : ""}${e.note ? `<br><span class="t">${esc(e.note)}</span>` : ""}</li>`).join("") || '<li class="t">No history yet.</li>'}</ul>`);

  bindCancelBox();
  if ($("retry")) $("retry").onclick = () => postManage({ action: "retry" }, $("retry"));
  if ($("change")) $("change").onclick = () => postManage({ action: "change", iso: $("cDate").value, from: Number($("cFrom").value), to: Number($("cTo").value) }, $("change"));
  if ($("cancel")) $("cancel").onclick = async () => (await OHDialog.confirm({ title: "Cancel this open house?", danger: true, ok: "Cancel open house", cancel: "Keep it",
    body: `${d.agent}'s open house at ${d.address}, ${d.when}. The agent and team will be emailed${d.byHand ? "; remove it from the MLS by hand." : ", and the AI agent marks it Canceled on the MLS."}` }))
    && postManage({ action: "cancel" }, $("cancel"));
}
load();
</script>
</body>
</html>
