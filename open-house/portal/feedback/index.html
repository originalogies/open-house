<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your Open House | Synergy Realty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/brand.css">
<link rel="stylesheet" href="/nav.css">
<style>
/* One of the agent's open houses: its details, and once it has ended the feedback form or the feedback they sent. */
.signed-out .wrap{visibility:hidden}
.fb{max-width:760px;margin:0 0 56px}
.fb-home{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;padding:16px;margin-bottom:22px}
.fb-home .thumb{width:96px;height:72px;border-radius:8px;background:var(--photo);object-fit:cover}
.fb-home .a{font-family:var(--serif);font-size:1.2rem;font-weight:500;line-height:1.2}
.fb-home .w{font-size:.92rem;color:var(--muted)}
.fb-home .st{margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.fb-home .rq{grid-column:1/-1;font-size:.9rem;padding:8px 10px;background:var(--bg);border-radius:8px}
.fb-home .rq b{display:block;font-size:.78rem;color:var(--muted);font-weight:600}
.back{margin:22px 0 0;font-size:.92rem}
.fb-part{padding:20px 22px;margin-bottom:18px}
.fb-part h2{font-family:var(--serif);font-weight:500;font-size:1.3rem;margin:0 0 4px}
.fb-part .label:first-of-type{margin-top:16px}
.fb-row{display:flex;gap:14px 20px;flex-wrap:wrap;align-items:flex-start}
.fb-row .label{margin-top:0}
.fb-row .visitors{width:80px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{padding:9px 11px;cursor:pointer;font-weight:600;font-size:.88rem;border-left:1px solid var(--line);white-space:nowrap}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink,#fff)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
textarea.field.big{min-height:170px}
.fb-part h2 + .fine{margin:0}
.said{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.said textarea{min-height:120px}
.fb-part hr{border:0;border-top:1px solid var(--line);margin:22px 0 4px}
.opt{font-weight:400;color:var(--muted)}
/* Photos the agent adds to the notes */
.ph-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ph-btns input{display:none}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:12px}
.ph-grid:empty{display:none}
.ph-grid figure{margin:0;position:relative}
.ph-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--photo);display:block}
.ph-grid button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:1rem;line-height:1;cursor:pointer}
#phMsg{margin:8px 0 0}
/* Something serious: one line to call the broker */
.broker{margin-top:18px;border:1.5px solid var(--danger);border-radius:12px;background:var(--danger-soft);padding:12px 14px}
.broker .call{color:var(--danger);font-weight:600;font-size:.95rem}
.broker .call a{color:inherit;font-weight:700;white-space:nowrap}
textarea.field.slim{min-height:0;height:64px}
.fb-done .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:4px}
.fb-done .photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
.fb-actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#fbErr{color:var(--danger)}
.fb-done{padding:22px}
.fb-done h2{font-family:var(--serif);font-weight:500;font-size:1.3rem;margin:0 0 6px}
.fb-done dl{margin:14px 0 0}.fb-done dt{font-size:.82rem;color:var(--muted);margin-top:12px}.fb-done dd{margin:2px 0 0;white-space:pre-wrap}
footer{border-top:1px solid var(--line);padding:22px 0 40px;font-size:.8rem;color:var(--muted)}
@media (max-width:600px){
  .said{grid-template-columns:1fr}
  .fb-row > div:last-child{flex-basis:100%}
  .seg.four{display:grid;grid-template-columns:1fr 1fr}
  .seg.four label{border-left:0;border-top:1px solid var(--line);text-align:center;padding:9px 10px}
  .seg.four label:nth-child(even){border-left:1px solid var(--line)}
  .seg.four label:nth-child(-n+2){border-top:0}
}
@media (max-width:600px){.fb-home{grid-template-columns:72px 1fr}.fb-home .thumb{width:72px;height:54px}.fb-part{padding:18px 16px}}
</style>
</head>
<body class="signed-out" data-page="mine">
<header class="topnav" id="topnav">
  <div class="wrap topnav-bar">
    <a class="topnav-brand" href="/"><img class="logo-light" src="/gn-logo.png" alt="George &amp; Noonan Real Estate Group"><img class="logo-dark" src="/gn-logo-white.png" alt="George &amp; Noonan Real Estate Group"><span class="topnav-label">Open House Portal</span></a>
  </div>
</header>
<div class="wrap">
  <p class="back"><a href="/my-open-houses/">← My Requests</a></p>
  <section class="intro" style="padding-top:10px"><div><h1 id="title">Your open house</h1>
    <p class="sub" id="lede"></p></div></section>
  <div class="fb" id="fb"><p class="muted">Loading…</p></div>
  <footer>Synergy Realty, LLC, 221 E Southlake Blvd, Suite 100, Southlake, TX 76092. Listing data from NTREIS via Repliers.</footer>
</div>

<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle" hidden>
  <div class="gate-card">
    <img class="logo logo-light" src="/gn-logo.png" alt="George &amp; Noonan Real Estate Group">
    <img class="logo logo-dark" src="/gn-logo-white.png" alt="George &amp; Noonan Real Estate Group">
    <h2 id="gateTitle">Sign in to see your open house</h2>
    <p>Use your Google account. Access is limited to approved Synergy agents.</p>
    <div id="gBtn"></div>
    <p class="gate-msg" id="gateMsg" role="alert" hidden></p>
  </div>
</div>

<script src="/nav.js"></script>
<script src="/auth.js"></script>
<script>
const CDN = "https://cdn.repliers.io/";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const photoSrc = (img, size) => /^(https?:|\/)/.test(img) ? img : CDN + img + "?class=" + size;
const INTEREST = { lots: "Lots", some: "Some", little: "Little" };
const PRICE = { high: "Too high", right: "About right", value: "Good value", none: "Didn't come up" };
// Who to call when something serious happens at an open house (same as BROKER in netlify/lib/feedback.mjs).
const BROKER = { name: "London George", phone: "(817) 995-8080", tel: "+18179958080" };
const callLink = () => `<a href="tel:${BROKER.tel}">${BROKER.phone}</a>`;
const id = new URLSearchParams(location.search).get("id") || "";
const box = $("fb");

const todayIso = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Chicago" }).format(new Date());
const fmtSent = ms => new Date(ms).toLocaleString("en-US", { timeZone: "America/Chicago", month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
// Same labels as My Requests.
function statusPill(o){
  const ended = Date.now() >= o.endsAt;
  if (o.cancelRequested && !ended) return ["pending", "Cancellation requested"];
  if (o.status === "approved") return ended ? ["approved", "Hosted"] : ["approved", "Approved"];
  return ({ pending:["pending","Waiting for approval"], declined:["declined","Declined"], expired:["","Expired, not answered"], cancelled:["","Cancelled"] })[o.status] || ["", o.status];
}
const heading = (title, lede) => { $("title").textContent = title; $("lede").textContent = lede; };
const homeCard = o => { const [c, t] = statusPill(o); return `<div class="card fb-home">
    ${o.img ? `<img class="thumb" src="${esc(photoSrc(o.img, "small"))}" alt="" onerror="this.style.visibility='hidden'">` : '<div class="thumb"></div>'}
    <div><div class="a">${esc(o.addr)}, ${esc(o.city)}</div><div class="w">${esc(o.day)}, ${esc(o.date)}${o.iso && o.iso.slice(0,4) !== todayIso().slice(0,4) ? `, ${o.iso.slice(0,4)}` : ""} · ${esc(o.time)}</div>
      <div class="st"><span class="pill ${c}">${esc(t)}</span>${o.status === "approved" && o.decidedBy ? `<span>Approved by ${esc(o.decidedBy)}</span>` : ""}</div></div>
    ${o.notes ? `<div class="rq"><b>Your note with the request</b>${esc(o.notes)}</div>` : ""}</div>`; };

// justSent: right after submitting ("sent" or "email_failed"); otherwise the agent came back to look at it.
function showSent(o, f, justSent){
  heading("Your open house", "The feedback you sent the George & Noonan team after hosting. Only the team sees it.");
  box.innerHTML = homeCard(o) + `<div class="card fb-done">
    <h2>${justSent ? "Thanks, your feedback was sent" : "Your feedback"}</h2>
    <p class="muted" style="margin:0">${justSent === "email_failed" ? "It's saved, and the George &amp; Noonan team will see it in the Admin Console. The email to the team didn't send."
      : justSent ? "The George &amp; Noonan team got it by email." : `Sent ${esc(fmtSent(f.at))}.`}${f.brokerFlag ? " You flagged it for the broker." : ""}</p>
    <dl><dt>Visitors</dt><dd>${f.visitors}</dd><dt>Guest interest</dt><dd>${esc(INTEREST[f.interest])}</dd>
      ${f.price ? `<dt>What guests thought of the price</dt><dd>${esc(PRICE[f.price])}</dd>` : ""}
      ${f.happened != null ? `<dt>What happened</dt><dd>${esc(f.happened)}</dd>` : `<dt>What guests liked</dt><dd>${f.liked ? esc(f.liked) : "Nothing noted"}</dd>
      <dt>What guests didn't like or would change</dt><dd>${f.disliked ? esc(f.disliked) : "Nothing noted"}</dd>
      ${f.forSeller ? `<dt>Additional feedback</dt><dd>${esc(f.forSeller)}</dd>` : ""}`}
      <dt>Notes for the team</dt><dd>${f.teamNotes ? esc(f.teamNotes) : "None"}</dd>
      ${(f.photos || []).length ? `<dt>Photos</dt><dd class="photos">${f.photos.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Photo from the open house"></a>`).join("")}</dd>` : ""}</dl>
    <p style="margin:18px 0 0"><a href="/my-open-houses/">Back to My Requests</a></p></div>`;
}

// Shrink a photo to at most 1600px on its longest side as a JPEG, so uploads stay small (same as the Admin Console).
function shrink(file, max = 1600){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("unreadable image")); };
    img.src = url;
  });
}

function showForm(o){
  heading("How did it go?", "Honest comments from guests help the seller most. Only the George & Noonan team sees this.");
  const seg = (name, opts) => `<div class="seg${Object.keys(opts).length > 3 ? " four" : ""}" role="radiogroup" aria-labelledby="${name}Label">${Object.entries(opts).map(([k,v]) => `<label><input type="radio" name="${name}" value="${k}">${v}</label>`).join("")}</div>`;
  // Phones get a camera button; everyone can pick photos they already took.
  const touch = matchMedia("(pointer: coarse)").matches;
  box.innerHTML = homeCard(o) + `<form id="form" novalidate>
    <section class="card fb-part">
      <div class="fb-row">
        <div><label class="label" for="visitors">Guests</label>
          <input class="field visitors" id="visitors" type="number" inputmode="numeric" min="0" max="999" required></div>
        <div><span class="label" id="interestLabel">Interest</span>${seg("interest", INTEREST)}</div>
        <div><span class="label" id="priceLabel">Price</span>${seg("price", PRICE)}</div>
      </div>
      <div class="said">
        <div><label class="label" for="liked">What they liked</label>
          <textarea class="field" id="liked" maxlength="5000" placeholder="Open kitchen, natural light, big backyard…"></textarea></div>
        <div><label class="label" for="disliked">What didn't guests like?</label>
          <textarea class="field" id="disliked" maxlength="5000" placeholder="Dated primary bath, noisy street, worn carpet upstairs…"></textarea></div>
      </div>
      <label class="label" for="forSeller">Additional feedback <span class="opt">(optional)</span></label>
      <textarea class="field slim" id="forSeller" maxlength="5000" rows="2" placeholder="Staging ideas, questions guests kept asking, how it compared to other homes…"></textarea>
      <hr>
      <label class="label" for="teamNotes">Notes for the team <span class="opt">(optional)</span></label>
      <textarea class="field" id="teamNotes" maxlength="5000" placeholder="Lights out, house not clean, lockbox code didn't work…"></textarea>
      <div class="ph-btns">
        ${touch ? `<label class="btn ghost small">Take a photo<input type="file" accept="image/*" capture="environment" data-ph></label>` : ""}
        <label class="btn ghost small">${touch ? "Choose photos" : "Add photos"}<input type="file" accept="image/*" multiple data-ph></label>
      </div>
      <p class="fine" id="phMsg" role="status" hidden></p>
      <div class="ph-grid" id="phGrid"></div>
      <div class="broker"><span class="call">Something serious? Call ${BROKER.name} · ${callLink()}</span></div>
    </section>
    <div class="fb-actions"><button class="btn" id="send" type="submit">Send feedback</button><p class="fine" id="fbErr" role="alert" hidden></p></div>
  </form>`;

  let photos = o.photos || [], uploading = false;
  const phMsg = (t, bad) => { $("phMsg").textContent = t; $("phMsg").hidden = !t; $("phMsg").style.color = bad ? "var(--danger)" : ""; };
  const paintPhotos = () => {
    $("phGrid").innerHTML = photos.map(p => `<figure><img src="${esc(p.url)}" alt="Photo you added"><button type="button" data-rm="${esc(p.id)}" aria-label="Remove photo">×</button></figure>`).join("");
    $("phGrid").querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
      b.disabled = true;
      const d = await post({ id, action: "unphoto", photo: b.dataset.rm });
      if (d.ok) { photos = d.data.photos; paintPhotos(); } else { b.disabled = false; phMsg(d.data.message || "Couldn't remove that photo. Try again.", true); }
    });
  };
  const post = async body => {
    const r = await fetch("/api/feedback", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).catch(() => null);
    return { ok: !!(r && r.ok), status: r ? r.status : 0, data: r ? await r.json().catch(() => ({})) : {} };
  };
  // One upload at a time, so each photo is saved before the next starts.
  document.querySelectorAll("[data-ph]").forEach(input => input.onchange = async () => {
    const files = [...input.files]; input.value = "";
    if (!files.length || uploading) return;
    uploading = true; $("send").disabled = true;
    let failed = 0;
    for (const [i, f] of files.entries()) {
      phMsg(`Uploading photo ${i + 1} of ${files.length}…`);
      const data = await shrink(f).catch(() => null);
      const d = data ? await post({ id, action: "photo", data }) : { ok: false, data: { message: `Couldn't read ${f.name}. Use a JPEG or PNG.` } };
      if (d.ok) { photos = d.data.photos; paintPhotos(); }
      else { failed++; phMsg(d.data.message || "A photo didn't upload. Try again.", true); if (d.data.error === "too_many_photos") break; }
    }
    if (!failed) phMsg("");
    uploading = false; $("send").disabled = false;
  });
  paintPhotos();

  $("form").onsubmit = async e => {
    e.preventDefault();
    const err = msg => { $("fbErr").textContent = msg; $("fbErr").hidden = !msg; };
    const pick = name => (document.querySelector(`input[name="${name}"]:checked`) || {}).value || "";
    const body = { id, visitors: $("visitors").value === "" ? "" : Number($("visitors").value), interest: pick("interest"), price: pick("price"),
      liked: $("liked").value, disliked: $("disliked").value, forSeller: $("forSeller").value, teamNotes: $("teamNotes").value, brokerFlag: false };
    err(""); $("send").disabled = true;
    const d = await post(body);
    if (d.ok || d.status === 502) {
      const t = k => body[k].trim();
      showSent(o, { ...body, liked: t("liked"), disliked: t("disliked"), forSeller: t("forSeller"), teamNotes: t("teamNotes"), at: Date.now(), photos: photos.map(p => p.url) }, d.status === 502 ? "email_failed" : "sent");
      scrollTo(0, 0);
      return;
    }
    err(d.data.message || "Could not send your feedback. Try again.");
    $("send").disabled = false;
  };
}

async function load(){
  const r = await fetch("/api/feedback?id=" + encodeURIComponent(id)).catch(() => null);
  if (!r || !r.ok) { box.innerHTML = `<p class="muted">${r && r.status === 404 ? 'We couldn\'t find that open house on your account. <a href="/my-open-houses/">See your open houses</a>.' : "Could not load this open house. Refresh to try again."}</p>`; return; }
  const o = await r.json();
  if (o.feedback) return showSent(o, o.feedback);  // coming back later: it was sent
  if (!o.open) {
    heading("Your open house", "");
    const msg = o.status === "approved" ? "You can leave feedback once this open house ends. We'll email you a link."
      : o.status === "pending" ? "The George &amp; Noonan team hasn't answered this request yet. You'll get an email when they do."
      : "This open house didn't take place, so there's nothing to leave feedback on.";
    box.innerHTML = homeCard(o) + `<p class="muted">${msg}</p>`;
    return;
  }
  showForm(o);
}
document.addEventListener("signedin", load);
</script>
</body>
</html>
